version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ehas-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ehas_secret}
      MYSQL_DATABASE: ${DB_NAME:-ehas}
    ports:
      - '3307:3306'
    volumes:
      - db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ehas-app
    restart: always
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-ehas_secret}
      DB_NAME: ${DB_NAME:-ehas}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-in-production}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node db/init.js && node app.js"

volumes:
  db-data:
